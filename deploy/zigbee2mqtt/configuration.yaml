# Initial zigbee2mqtt configuration, copied into the data volume on first
# start. Later changes go into the volume (or the frontend on port 8080).
homeassistant:
  enabled: false
mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883
serial:
  port: /dev/zigbee
  # TI CC2652 with Z-Stack firmware.
  adapter: zstack
frontend:
  enabled: true
  port: 8080
# Tells Knut when a light loses power, e.g. at a wall switch. Mains-powered
# devices are pinged; after 2 minutes (default 10) without an answer they
# count as offline.
availability:
  enabled: true
  active:
    timeout: 2
advanced:
  # Channel 11 (the default) overlaps Wi-Fi channel 1; 20 sits between Wi-Fi
  # channels 6 and 11. Changing it later means re-pairing every device.
  channel: 20
  # CC2652P sticks ship with low transmit power; 20 dBm is their maximum.
  transmit_power: 20
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
  log_level: info
